# Pull-request CI. Runs on drafts, for PRs into `dev` (the testing branch) and
# `main`. Ported from QA #5 (ci/pr-qa-and-bug-review): static-and-unit plus the
# container job, keeping #5's job ids (static-and-unit, container).
# The offline unit suites (tests/prehook-*.sh, tests/image-supply-chain.sh) are
# executed. Live-agent suites in tests/*.sh are not run (they need an onboarded
# agent), so they are syntax/lint-checked only.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject CRLF shell scripts
        run: '! grep -Il $''\r'' $(git ls-files ''*.sh'') | grep .'
      - name: Shell syntax
        run: |
          for file in $(git ls-files '*.sh'); do
            bash -n "$file"
          done
      - name: ShellCheck
        run: shellcheck -x -S warning $(git ls-files '*.sh')
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Offline prehook unit tests
        run: bash tests/prehook-fail-closed.sh
      - name: Offline prehook exemption tests
        run: bash tests/prehook-exemptions.sh
      # Reads the Dockerfile and compose file, which are not copied into the
      # image, so it runs here rather than from tests/run-all.sh.
      - name: Image supply-chain checks
        run: bash tests/image-supply-chain.sh

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t atbash-sandbox:ci .
      - name: Non-root image user
        run: test "$(docker inspect atbash-sandbox:ci --format '{{.Config.User}}')" = atbash
      - name: CLI smoke (version resolves inside the image)
        run: docker run --rm --entrypoint sh atbash-sandbox:ci -c 'atbash --version'
      - name: Config dir permissions
        run: docker run --rm --entrypoint sh atbash-sandbox:ci -c 'test "$(stat -c %a /home/atbash/.config/atbash)" = 700'
      # The steps above bypass the entrypoint. These go through the real one:
      # tini as PID 1 running /opt/atbash/entrypoint.sh, which seeds and
      # re-moderates the config on boot. The dummy key is not a real key and
      # never leaves the container.
      - name: Real entrypoint with a dummy key (tini PID 1, uid 10001, modes)
        run: |
          docker run --rm -e ATBASH_AGENT_KEY=ci-dummy-not-a-key atbash-sandbox:ci sh -c '
            set -e
            test "$(id -u)" = 10001
            test "$(readlink /proc/1/exe)" = /usr/bin/tini
            grep -q /opt/atbash/entrypoint.sh /proc/1/cmdline
            test "$(stat -c %a ~/.config/atbash)" = 700
            test "$(stat -c %a ~/.config/atbash/telemetry.json)" = 600
            if [ -e ~/.config/atbash/config.json ]; then test "$(stat -c %a ~/.config/atbash/config.json)" = 600; fi
            echo "entrypoint ok: uid 10001, tini PID 1, config 700, telemetry.json 600"'
      # No key: the entrypoint runs `atbash keygen`, which writes config.json.
      # Its stdout (a throwaway keypair) is discarded, not logged.
      - name: Real entrypoint without a key (keygen config.json is 0600)
        run: |
          docker run --rm atbash-sandbox:ci sh -c '
            test "$(id -u)" = 10001 &&
            test "$(stat -c %a ~/.config/atbash/config.json)" = 600 &&
            test "$(stat -c %a ~/.config/atbash/telemetry.json)" = 600 ||
            { echo "keygen boot: wrong uid or config modes" >&2; exit 1; }' >/dev/null
      - name: Prehook fails closed inside the image (as uid 10001)
        run: docker run --rm --entrypoint bash atbash-sandbox:ci /opt/atbash/tests/prehook-fail-closed.sh
